name: Behavior Diff

on:
  pull_request:
    types: [opened]
    paths:
      - '**/SKILL.md'
      - '.github/workflows/behavior-diff.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      approved-sha:
        description: Full current PR head SHA that you have reviewed
        required: true
        type: string
      file:
        description: Exact instruction path (blank selects all eligible changes)
        type: string
      fast:
        description: One trial per side
        type: boolean
        default: false

permissions: {}

# Serialize every publisher for a PR; an older run must not overwrite newer evidence.
concurrency:
  group: behavior-diff-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/behavior-diff ') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && 'comparison' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/behavior-diff ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      status: ${{ steps.prepare.outputs.status }}
    steps:
      # Resolve once per run, not once per target. Never fall back to the bundled core.
      - name: Resolve latest stable Behavior Diff core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/spacedock-dev/behavior-diff/releases/latest --jq '.tag_name')
          [[ -n "$tag" && "$tag" != null ]]
          sha=$(gh api "repos/spacedock-dev/behavior-diff/commits/$tag" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Behavior Diff core: %s (%s)\n' "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare comparisons
        # Follow wrapper patch releases; core version is resolved independently above.
        uses: spacedock-dev/behavior-diff-action@v0.1
        id: prepare
        with:
          mode: prepare
          core-ref: ${{ steps.core.outputs.sha }}
          trust-policy: same-repository
          publication: comment
          plugin-root: plugins/skills-set
          pr: ${{ inputs.pr }}
          approved-sha: ${{ inputs.approved-sha }}
          file: ${{ inputs.file }}
          fast: ${{ inputs.fast || false }}
          max-files: '3'
  run:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    environment: behavior-diff
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Compare instruction behavior
        uses: spacedock-dev/behavior-diff-action@v0.1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          mode: run
          selection: ${{ toJSON(matrix) }}
          trust-policy: same-repository
          publication: comment
          plugin-root: plugins/skills-set
          pr: ${{ inputs.pr }}
          approved-sha: ${{ inputs.approved-sha }}
          file: ${{ inputs.file }}
          fast: ${{ inputs.fast || false }}
          max-files: '3'
          timeout-minutes: '45'
          retention-days: '7'
  publish:
    needs: [prepare, run]
    if: ${{ always() && needs.prepare.outputs.status == 'ready' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Publish comparison evidence
        uses: spacedock-dev/behavior-diff-action@v0.1
        with:
          mode: publish
          selection: ${{ toJSON(matrix) }}
          publication: comment
